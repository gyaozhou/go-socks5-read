apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf-1
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "multihoming",
    "plugins": [
      {
        "type": "macvlan",
        "master": "eth0",
        "mode": "bridge",
        "ipam": {
          "type": "static",
          "addresses": [
            {
                "address": "10.10.0.12/24",
             
            },
            {
                "address": "10.20.0.12/24",
                "gateway": "10.20.0.1"
            }
        ]
        }
      },
      {
        "type": "sbr"
      }
    ]
  }'


---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf-2
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "multihoming",
    "plugins": [
      {
        "type": "macvlan",
        "master": "eth0",
        "mode": "bridge",
        "ipam": {
          "type": "static",
          "addresses": [
            {
                "address": "10.10.0.20/24",
                "gateway": "10.10.0.1"
            },
            {
                "address": "10.20.0.20/24",
                "gateway": "10.20.0.1"
            }
        ]
        }
      },
      {
        "type": "sbr"
      }
    ]
  }'



---
apiVersion: v1
kind: Pod
metadata:
  name: multus-sbr-1
  annotations:
    k8s.v1.cni.cncf.io/networks: macvlan-conf-1
spec:
  containers:
    - name: wget
      image: quay.io/quay/busybox
      command: ['sleep', '3600']
  restartPolicy: Never

---
apiVersion: v1
kind: Pod
metadata:
  name: multus-sbr-2
  annotations:
    k8s.v1.cni.cncf.io/networks: macvlan-conf-2
spec:
  containers:
    - name: wget
      image: quay.io/quay/busybox
      command: ['sleep', '3600']
  restartPolicy: Never
