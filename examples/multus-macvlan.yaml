apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf
spec:
  config: '{
      "cniVersion": "0.3.0",
      "type": "macvlan",
      "master": "eth0",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "ranges":[
          [{
            "subnet": "10.10.1.0/24",
            "rangeStart": "10.10.1.20",
            "rangeEnd": "10.10.1.254",
            "gateway": "10.10.1.1"
          } ]
       ]
      }
    }'

---
apiVersion: v1
kind: Pod
metadata:
  name: multus-macvlan
  annotations:
    k8s.v1.cni.cncf.io/networks: macvlan-conf
spec:
  containers:
    - name: wget
      image: quay.io/quay/busybox
      command: ['sleep', '3600']
  restartPolicy: Never
